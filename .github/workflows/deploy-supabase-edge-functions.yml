# Browser-only deploy: GitHub → Actions → "Deploy Supabase notify functions" → Run workflow.
# One-time secret: SUPABASE_ACCESS_TOKEN (https://supabase.com/dashboard/account/tokens)
# Optional: SUPABASE_PROJECT_REF overrides ffgcivxvbtdlmfnttwjm from config.toml.
name: Deploy Supabase notify functions

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase-edge-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require SUPABASE_ACCESS_TOKEN
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::GitHub Actions secret SUPABASE_ACCESS_TOKEN is empty. Repo → Settings → Secrets → Actions → add it (https://supabase.com/dashboard/account/tokens)."
            exit 1
          fi

      - name: Deploy Edge Functions
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          REF="${PROJECT_REF:-ffgcivxvbtdlmfnttwjm}"
          if ! supabase projects list >/dev/null 2>&1; then
            echo "::error::Supabase CLI returned Unauthorized. Regenerate SUPABASE_ACCESS_TOKEN at https://supabase.com/dashboard/account/tokens and update the GitHub Actions secret."
            exit 1
          fi
          supabase functions deploy notify_carers_on_hypo --project-ref "$REF" --no-verify-jwt
          supabase functions deploy notify_scenario_started --project-ref "$REF" --no-verify-jwt
          supabase functions deploy notify_alcohol_night_mode --project-ref "$REF" --no-verify-jwt
          supabase functions deploy notify_supply_low --project-ref "$REF" --no-verify-jwt
          supabase functions deploy notify_supply_low_cron --project-ref "$REF" --no-verify-jwt
          supabase functions deploy notify_supporter_appointment_reminders --project-ref "$REF" --no-verify-jwt
          supabase functions deploy notify_dm_push --project-ref "$REF" --no-verify-jwt
          supabase functions deploy notify_feed_push --project-ref "$REF" --no-verify-jwt
          supabase functions deploy notify_patient_hypo_acknowledged --project-ref "$REF" --no-verify-jwt
          supabase functions deploy notify_patient_hypo_check_in --project-ref "$REF" --no-verify-jwt
          supabase functions deploy notify_carer_hypo_check_in_response --project-ref "$REF" --no-verify-jwt
          supabase functions deploy notify_push_test --project-ref "$REF" --no-verify-jwt
          # JWT verified at gateway + in handler (see supabase/config.toml). Do not pass --no-verify-jwt.
          supabase functions deploy ai_coach --project-ref "$REF"
