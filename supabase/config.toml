# Minimal Supabase CLI config. Run migrations and deploy functions from repo root:
#   supabase link
#   supabase db push
#   supabase functions deploy notify_carers_on_hypo
#
# Gateway JWT verification is off for this function; the handler validates the JWT with
# auth.getUser(jwt). That avoids 401 at the edge (execution_id null) when the platform
# gateway and in-function checks disagree. Redeploy after changing verify_jwt.

project_id = ""

[api]
enabled = true

[functions.notify_carers_on_hypo]
verify_jwt = false
