# Minimal Supabase CLI config. Run migrations and deploy functions from repo root:
#   supabase link
#   supabase db push
#   supabase functions deploy notify_carers_on_hypo --no-verify-jwt
#   supabase functions deploy notify_scenario_started --no-verify-jwt
#   supabase functions deploy notify_supply_low --no-verify-jwt
#   supabase functions deploy notify_supply_low_cron --no-verify-jwt
#   supabase functions deploy notify_dm_push --no-verify-jwt
#   supabase functions deploy notify_push_test --no-verify-jwt
#
# Gateway JWT verification is off for these functions; each handler validates the JWT with
# auth.getUser(jwt). That avoids 401 at the edge ("Invalid JWT" from the gateway) when the
# platform gateway and in-function checks disagree. Redeploy after changing verify_jwt.

# Set by `supabase link` or paste your Project ref (Dashboard → Settings → General).
project_id = "ffgcivxvbtdlmfnttwjm"

[api]
enabled = true

[functions.notify_carers_on_hypo]
verify_jwt = false

[functions.notify_scenario_started]
verify_jwt = false

[functions.notify_supply_low]
verify_jwt = false

[functions.notify_supply_low_cron]
verify_jwt = false

[functions.notify_dm_push]
verify_jwt = false

[functions.notify_push_test]
verify_jwt = false

# AI Coach: user JWT verified at the gateway (default). Handler also validates with auth.getUser.
[functions.ai_coach]
verify_jwt = true

# Ask Beatie on community feed — same gateway JWT pattern as ai_coach.
[functions.ai_feed_reply]
verify_jwt = true
